<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Full Of Stuff by Joe</title>
    <style>
        /* Basic styling to make the site look clean and modern */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #24292e; /* GitHub dark gray color */
            margin-top: 0;
        }
        p {
            font-size: 1.1rem;
            color: #586069;
        }
        .btn {
            display: inline-block;
            background-color: #2ea44f; /* GitHub green color */
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My GitHub Website! 👋</h1>
        <p>This page was successfully created and is hosted for free using GitHub Pages.</p>
        <p>You can edit this HTML file to add your own bio, project details, or photos.</p>
        <a href="https://github.com" class="btn" target="_blank">Visit GitHub</a>
    </div>

</body>
</html>
